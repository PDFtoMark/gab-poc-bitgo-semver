on:   # yamllint disable-line rule:truthy
  pull_request:

name: Check semver breaks
permissions: {}

jobs:
  PR:
    name: PR Semver - stable toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: "Simulate semver check"
        run: |
          echo "checking semver"
          # attacker-controlled artifact: the PR number the privileged
          # workflow_run workflow will comment on and label is chosen here
          echo -n 1 > semver-break
          ls -l semver-break
      - name: "Save breaking state"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: semver-break
          path: semver-break
